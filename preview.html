function validateFeature(feature){
 const failures=[];
 if(!/^F\d{3,}$/.test(feature.id))failures.push('ID 格式错误');
 if(!feature.title?.trim())failures.push('缺少名称');
 if(!feature.problem?.trim()||!feature.goal?.trim())failures.push('缺少问题或目标');
 if(!feature.requirements?.length)failures.push('缺少需求');
 if(!feature.fields?.length)failures.push('缺少业务字段');
 if(!feature.variants?.length)failures.push('缺少交互方案');
 if(!feature.acceptance?.length)failures.push('缺少验收标准');
 const ids=new Set();
 for(const v of feature.variants||[]){
  if(ids.has(v.id))failures.push('重复方案 ID '+v.id);ids.add(v.id);
  if(!v.steps?.length)failures.push(v.id+' 缺少交互步骤');
  const steps=(v.steps||[]).map(x=>x.id);
  if(new Set(steps).size!==steps.length)failures.push(v.id+' 步骤 ID 重复');
 }
 return {ok:!failures.length,failures};
}
function studioHealth(){return features.map(f=>({id:f.id,...validateFeature(f)}))}

function mountSwim(target,variant,notify=()=>{}){
 let checks=[false,false,false],opened=false,completed=false;let timerIds=[];
 const clearTimers=()=>{timerIds.forEach(clearTimeout);timerIds=[]};
 function draw(){
  const ready=checks.every(Boolean);
  target.innerHTML=`<div class="phone-demo"><div class="phone-status"><span>9:41</span><span>●●● ▰</span></div>
  <div class="phone-head"><span class="phone-back">${icon('arrowleft',16)} 返回</span><span class="phone-head-title">任务详情</span><span>···</span></div>
  <div class="swim-illustration"><span class="swim-water">≈</span><span class="swim-emote">🏊</span><span class="swim-water next">≈</span></div>
  ${completed?`<div class="demo-success" role="status"><div class="success-circle">${icon('check',30)}</div><h3>准备好了！</h3><p>三件物品都已确认。<br>祝你游泳愉快。</p><span class="demo-success-tag">${icon('checkcircle',13)} 任务状态已更新</span></div>`:
   `<div class="demo-copy"><div class="eyebrow">明天 · 15:00</div><h3>去游泳</h3><p>别忘了出门前带好装备</p></div>
    ${variant==='a'?`<div class="demo-checklist"><div class="demo-section-title">出门准备 <span>${checks.filter(Boolean).length} / 3</span></div>
      ${names.map((n,i)=>`<label class="demo-check"><input type="checkbox" data-item="${i}" ${checks[i]?'checked':''}/><span class="demo-check-label">${n}</span>${checks[i]?`<span class="done-tick">${icon('check',15)}</span>`:''}</label>`).join('')}
    </div><button class="demo-primary" data-action="finish" ${ready?'':'disabled'}>确认准备完成 ${icon('arrow',15)}</button>`:
    `<div class="demo-compact"><div class="demo-compact-icon">${icon('list',19)}</div><div><strong>出门前检查</strong><small>泳裤 · 泳镜 · 学生卡</small></div><span>${icon('chevron',17)}</span></div><button class="demo-primary" data-action="open">开始核对 ${icon('arrow',15)}</button>`}
    ${variant==='b'&&opened?`<div class="demo-overlay"><div class="demo-overlay-header"><strong>核对你的装备</strong><button data-action="close" aria-label="关闭">${icon('close',17)}</button></div>
      <p>出发前逐项确认，确保没有遗漏。</p><div class="demo-checklist inset">${names.map((n,i)=>`<label class="demo-check"><input type="checkbox" data-item="${i}" ${checks[i]?'checked':''}/><span class="demo-check-label">${n}</span>${checks[i]?`<span class="done-tick">${icon('check',15)}</span>`:''}</label>`).join('')}</div>
      <button class="demo-primary" data-action="finish" ${ready?'':'disabled'}>全部准备好了 ${icon('check',15)}</button></div>`:''}`}
  <div class="phone-bottom"><span></span></div></div>`;
  target.querySelectorAll('[data-item]').forEach(c=>c.addEventListener('change',()=>{checks[Number(c.dataset.item)]=c.checked;notify('item.checked');draw()}));
  target.querySelector('[data-action="finish"]')?.addEventListener('click',()=>{if(!checks.every(Boolean))return;completed=true;opened=false;notify('task.completed');draw()});
  target.querySelector('[data-action="open"]')?.addEventListener('click',()=>{opened=true;notify('checklist.started');draw()});
  target.querySelector('[data-action="close"]')?.addEventListener('click',()=>{opened=false;draw()});
 }
 function setStep(step){
  clearTimers();checks=[false,false,false];opened=false;completed=false;
  if(step===1){if(variant==='b')opened=true;else checks[0]=true}
  if(step===2){checks=[true,true,true];opened=variant==='b'}
  if(step>=3){checks=[true,true,true];completed=true}
  draw();
 }
 function replay(onStep=()=>{}){
  clearTimers();setStep(0);onStep(0);
  const seq=variant==='a'?[[650,()=>{checks[0]=true;draw();onStep(1)}],[1100,()=>{checks[1]=true;draw()}],[1600,()=>{checks[2]=true;draw();onStep(2)}],[2200,()=>{completed=true;draw();onStep(3)}]]:
   [[550,()=>{opened=true;draw();onStep(1)}],[1000,()=>{checks[0]=true;draw()}],[1400,()=>{checks[1]=true;draw()}],[1800,()=>{checks[2]=true;draw();onStep(2)}],[2400,()=>{completed=true;opened=false;draw();onStep(3)}]];
  timerIds=seq.map(([t,fn])=>setTimeout(fn,t));
 }
 draw();return {setStep,replay,reset:()=>setStep(0),destroy:clearTimers};
}


function mountCreate(target,variant,notify=()=>{}){
 let step=0,input='明天下午去游泳，记得带泳裤、泳镜和学生卡',timers=[];
 const clear=()=>{timers.forEach(clearTimeout);timers=[]};
 function draw(){
  const body=step===3
   ? `<div class="demo-success" role="status"><div class="success-circle">${icon('check',28)}</div><h3>任务已创建</h3><p>“去游泳”已添加到任务列表</p><span class="demo-success-tag">模拟结果 · 未写入数据库</span></div>`

 }
 function setStep(n){clear();step=n;draw()}
 function replay(onStep=()=>{}){setStep(0);onStep(0);[1,2,3].forEach((n,i)=>timers.push(setTimeout(()=>{step=n;draw();onStep(n)},700+(i*650))))}
 draw();return{setStep,replay,reset:()=>setStep(0),destroy:clear};
}

function reviewView(){const f=getCurrent(),checks=s.reviewedChecks[f.id]||{};const checked=f.acceptance.filter(a=>checks[a.id]).length;const health=studioHealth();return `${head('HUMAN-IN-THE-LOOP','审查、反馈与确认','机器负责检查结构和显而易见的规则，你负责判断体验是否合理。审批只标记选择，不会自动修改真实业务系统。')}

<div class="card card-pad" style="margin-bottom:18px"><div class="section-heading"><h2>AI 协作的五个强制关卡</h2>${badge('AGENTS.md')}</div><div class="doc-grid">${[['01','分析需求','写出问题、目标、必要字段和边界'],['02','生成候选','创建独立交互方案与可运行场景'],['03','运行检查','结构、类型、Token 和核心交互测试'],['04','人工体验','可播放流程、切换主题、对比 A/B'],['05','确认交付','保留旧方案、记录选择、生成后续开发任务']].map(([n,a,b])=>`<div class="pill-step"><span class="circle-no">${n}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div></div>
<div class="doc-grid"><div class="card card-pad"><div class="section-heading"><h2>新功能怎么加？</h2></div><p class="small muted">① 在 <code>src/data/features.js</code> 定义新功能的需求、字段和流程。<br>② 在 <code>src/components/</code> 编写独立可运行的原型。<br>③ 将组件登记到 <code>src/app.js</code> 的 Demo Registry。<br>④ 补充验证，运行 <code>npm run check</code>。<br>⑤ 让你在工作台中试用后再选定方案。</p><div class="divider"></div>${button(`${icon('copy',14)} 复制 AI 工作指令`,'copy-agent','btn-primary')}</div><div class="card card-pad"><div class="section-heading"><h2>本地运行</h2></div><div class="spec-block"><code>npm run dev</code><p style="margin-top:6px">访问 http://localhost:5173。没有运行时依赖，Node.js 20+ 即可。</p></div><div style="height:10px"></div><div class="spec-block"><code>npm run check</code><p style="margin-top:6px">运行 Token/CSS 规则检查与结构测试。</p></div><div class="divider"></div>${button(`${icon('download',14)} 导出当前设计包`,'export')}</div></div><div class="card card-pad" style="margin-top:18px"><div class="section-heading"><h2>当前版本的明确边界</h2></div><p class="small muted">这是<strong>离线可运行的产品设计工作台 MVP</strong>，不是已经接入你个人模型或 SuperAgent 的完整 SaaS。三个功能使用 Mock 数据。审核状态保存在本机浏览器。自动回放与结构校验已经实现；真实大模型接入、跨设备同步、Storybook/MDX 集成、可点击图节点与视觉截图回归是后续迭代。</p></div>`}
function mountCurrent(){const f=getCurrent(),v=currentVariant(f);if(s.page==='feature'){
 const node=document.getElementById('live-preview');if(node){preview=mountDemo(node,f,v,()=>{});}
 }else if(s.page==='compare'){comparisons=f.variants.map(variant=>({id:variant.id,...mountDemo(document.getElementById('compare-'+variant.id),f,variant.id)}))}
}
function render(){destroyPreviews();document.documentElement.dataset.theme=s.theme;const pages={overview:overviewView,feature:featureView,compare:compareView,design:designView,review:reviewView,guide:guideView};root.innerHTML=`<div class="app-shell">${navView()}<div class="main-frame">${topView()}<main class="content" id="content">${(pages[s.page]||overviewView)()}</main></div></div>`;mountCurrent()}
function go(page){if(!labels[page])return;s.page=page;store();render();window.scrollTo({top:0,behavior:'instant'})}
function selectFeature(id){s.currentFeature=id;s.activeTab='requirements';s.page='feature';store();render();window.scrollTo({top:0,behavior:'instant'})}
function selectStep(n){preview?.setStep(n);document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',Number(b.dataset.step)===n))}
function changeVariant(v){s.variantByFeature[s.currentFeature]=v;store();render()}
function changeTheme(id){s.theme=id;store();document.documentElement.dataset.theme=id;document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===id));showToast('主题已切换 · 未更改业务数据')}
function exportCurrent(){const f=getCurrent(),packet={exportedAt:new Date().toISOString(),format:'forma-feature-package-v1',feature:f,review:{notes:s.reviews[f.id]||'',checks:s.reviewedChecks[f.id]||{},approvedVariant:s.approved[f.id]||null},design:{theme:s.theme}};const blob=new Blob([JSON.stringify(packet,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${f.id}-design-package.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('已导出 '+f.id+' 设计包 JSON')}
function copyAgent(){const task=`你是本仓库的 AI Product Designer。请先阅读 AGENTS.md 和 docs/WORKFLOW.md。不要绕过审核关卡。所有新增功能必须有 ID、需求、业务字段、交互方案、可运行原型和验收条件。禁止在功能 CSS 中硬编码颜色，统一使用设计 Tokens。请在独立文件内实现候选方案，保留已批准方案，运行 npm run check，列出变更影响，再提交让我体验。`;navigator.clipboard?.writeText(task).then(()=>showToast('AI 工作指令已复制')).catch(()=>showToast('复制未成功，请阅读仓库 AGENTS.md'))}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){go(b.dataset.page);return}
 if(b.dataset.feature){selectFeature(b.dataset.feature);return}
 if(b.dataset.tab){s.activeTab=b.dataset.tab;store();render();return}
 if(b.dataset.variant){changeVariant(b.dataset.variant);return}
 if(b.dataset.themeChoice){changeTheme(b.dataset.themeChoice);return}
 if(b.dataset.step!==undefined){selectStep(Number(b.dataset.step));return}
 if(b.dataset.approve){const f=getCurrent();s.approved[f.id]=b.dataset.approve;logAction(s,`${f.id} 选定方案 ${b.dataset.approve.toUpperCase()}`);render();showToast('已保存方案选择，其他方案仍被保留');return}
 if(b.dataset.replayCompare){const c=comparisons.find(x=>x.id===b.dataset.replayCompare);c?.replay();return}
 if(b.dataset.resetCompare){const c=comparisons.find(x=>x.id===b.dataset.resetCompare);c?.reset();return}
 const action=b.dataset.action;
 if(action==='go-feature'||action==='open-first'){selectFeature('F001');return}
 if(action==='compare'){go('compare');return}
 if(action==='replay'){preview?.replay(i=>{document.querySelectorAll('[data-step]').forEach(x=>x.classList.toggle('active',Number(x.dataset.step)===i))});return}
 if(action==='reset'){selectStep(0);return}
 if(action==='export'){exportCurrent();return}
 if(action==='copy-agent'){copyAgent();return}
 if(action==='menu'){document.getElementById('sidebar').classList.add('open');document.querySelector('.sidebar-backdrop').classList.add('open');return}
 if(action==='close-menu'){document.getElementById('sidebar').classList.remove('open');document.querySelector('.sidebar-backdrop').classList.remove('open');return}
});
root.addEventListener('change',e=>{
 if(e.target.matches('[data-review-check]')){const f=getCurrent();s.reviewedChecks[f.id]??={};s.reviewedChecks[f.id][e.target.dataset.reviewCheck]=e.target.checked;store();}
});
root.addEventListener('input',e=>{if(e.target.matches('#review-notes')){s.reviews[s.currentFeature]=e.target.value;store()}});
render();
